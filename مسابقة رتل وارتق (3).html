<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسابقة رتل وارتق (3)</title>
<style>
:root{
  --bg:#e9efea; --surface:#f7faf7; --ink:#183029; --muted:#5d746c;
  --green:#14463d; --green-soft:#cfe0d8; --brass:#b3862a; --brass-soft:#f1e3bd; --line:#c3d3cb;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1f1b; --surface:#16302a; --ink:#e8f1ec; --muted:#94afa5;
    --green:#5fc2a8; --green-soft:#24463d; --brass:#e0b552; --brass-soft:#3d3416; --line:#2d4d43;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Naskh Arabic","Amiri","Geeza Pro","Segoe UI",Tahoma,serif;line-height:1.7;
  padding:max(16px,env(safe-area-inset-top)) 16px 48px}
.wrap{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px}
header.top-head{flex-direction:column;align-items:stretch;gap:16px;margin:14px 8px 22px}
.head-btns{display:flex;gap:8px;justify-content:center;margin:26px 0 6px}
#toggle{background:transparent;color:var(--muted);border:1.5px dashed var(--line);font-size:1rem;padding:8px 22px;opacity:.9}
body.edit{padding-bottom:100px}
body.edit .head-btns{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);margin:0;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:15}
body.edit #toggle{background:var(--green);color:var(--surface);border:1px solid var(--green);font-size:1.1rem;padding:9px 26px;opacity:1}
#undo{display:none}
body.edit #undo{display:inline-block}
button:disabled{opacity:.45;cursor:default}
.banner-img{display:block;width:100%;height:auto;border-radius:12px}
.sub{color:var(--muted);font-size:.95rem;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:6px 14px}
button:hover{border-color:var(--green)}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button.primary{background:var(--green);color:var(--surface);border-color:var(--green)}
.dark-btn-fix{color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.card.done{border-color:var(--brass);background:linear-gradient(0deg,var(--brass-soft),var(--surface) 70%)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font-size:1.25rem;font-weight:700;margin:0}
.count{color:var(--muted);font-size:.95rem}
.count b{color:var(--green);font-size:1.15rem}
.card.done .count b{color:var(--brass)}

/* the track: stations = juz' */
.track{position:relative;height:76px;margin:22px 12px 6px}
.rail,.fill{position:absolute;top:29px;height:6px;border-radius:6px;right:0}
.rail{left:0;background:var(--green-soft)}
.fill{background:var(--green);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.card.done .fill{background:var(--brass)}
.station{position:absolute;top:22px;width:20px;height:20px;margin-right:-10px;border-radius:50%;
  background:var(--surface);border:3px solid var(--green-soft);transition:background .4s,border-color .4s}
.station.on{background:var(--green);border-color:var(--green)}
.card.done .station.on{background:var(--brass);border-color:var(--brass)}
.station.goal{width:26px;height:26px;top:19px;margin-right:-13px;border-color:var(--brass);
  display:grid;place-items:center;font-size:.8rem;color:var(--brass)}
.station.goal.on{background:var(--brass);color:#fff}
.lbl{position:absolute;top:58px;font-size:.78rem;color:var(--muted);transform:translateX(50%);margin-right:0}
.marker{position:absolute;top:7px;width:44px;height:44px;margin-right:-22px;z-index:2;user-select:none;-webkit-user-select:none;
  transition:right .7s cubic-bezier(.2,.8,.2,1)}
.marker img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;
  border:2px solid var(--brass);background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}

.ctrl{display:none;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
body.edit .ctrl{display:flex}
.ctrl input{font:inherit;width:64px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ctrl .gap{flex:1}
.ctrl input.nm,.ctrl input.jl{width:100%;flex:1 1 100%}
.ctrl input.nm{font-weight:700}
.jtag{font-size:.85rem;font-weight:400;color:var(--muted)}
.ctrl input[type=checkbox]{width:auto}
.danger{color:#b3352b}
.danger.armed{background:#b3352b;color:#fff;border-color:#b3352b}
.add{display:none;gap:8px;margin-bottom:16px}
body.edit .add{display:flex}
.add input{font:inherit;flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.add input.n{flex:0 0 80px}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin-top:20px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
body.edit .marker{cursor:grab;touch-action:none}
.marker.drag,.track.drag .fill{transition:none}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  #toggle,.add,.ctrl,.hint{display:none!important}
  .card,.plaque{break-inside:avoid}
}
.marker.drag{cursor:grabbing;transform:scale(1.08)}
@media (prefers-reduced-motion:reduce){.fill,.marker,.station{transition:none}}
.mini{font-size:.85rem;padding:4px 12px}
.open-row{margin-top:10px}
#detail{display:none}
body.detailing #detail{display:block}
body.detailing #list,body.detailing .add,body.detailing .hint,body.detailing .tools{display:none!important}

.tools{display:none;gap:8px;justify-content:center;margin-top:16px}
body.edit .tools{display:flex}
.bar{height:14px;border-radius:99px;border:1.5px solid var(--green);background:var(--surface);overflow:hidden;display:flex;margin:10px 0}
.bar i{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;border:1.5px solid var(--green);margin-left:5px;vertical-align:-2px}
.jg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:440px;margin:12px auto 0}
.jg button{flex:0 0 calc((100% - 42px)/8);aspect-ratio:1;padding:0;border:1.5px solid var(--green);border-radius:50%;font-weight:700;overflow:hidden}
.jg .open{outline:3px solid var(--brass);outline-offset:1px}
.num{background:rgba(255,255,255,.85);color:#183029;border-radius:6px;padding:0 4px;font-size:.8rem;line-height:1.3}
.pgr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.pgr button{min-height:62px;padding:4px 2px;border:1.5px solid var(--green);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2;font-weight:700}
.sn{font-size:.68rem;font-weight:700;text-align:center;max-width:100%}
.auto{background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.9}
.auto.muted{font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;border-radius:8px;padding:0 8px;font-size:.8rem;color:#fff;margin-left:4px}
.tg{background:var(--green)}.td{background:var(--brass)}
.restore{display:block;width:100%;margin-bottom:14px;background:transparent;border:2px dashed var(--green);color:var(--green);border-radius:16px;padding:12px;font-weight:700}
.s1{background:var(--brass)!important;color:#fff}
.s2{background:var(--green)!important;color:var(--surface)}
.lbl2{display:block;font-weight:700;margin:12px 0 4px}
.lines,.dt{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink)}
.lines{min-height:70px;resize:vertical}
.tick{display:flex;align-items:center;gap:8px;margin-top:8px;width:100%;padding:8px 12px;border-radius:12px}
.tick.on{background:var(--green);color:var(--surface)}
.box{width:20px;height:20px;border:2px solid currentColor;border-radius:6px;display:grid;place-items:center;font-size:.8rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:var(--surface);border-radius:99px;padding:10px 18px;z-index:20}
.two,.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{margin:14px 0}
/* عرض فقط إلى أن تضغط «تعديل» */
body:not(.edit) #detail [data-d="hide"],body:not(.edit) #detail [data-d="show"],body:not(.edit) #detail [data-d="fill"],body:not(.edit) #detail [data-d="newweek"],body:not(.edit) #detail [data-d="sync"]{display:none}
.lines:disabled,.dt:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);resize:none}
.pwbox{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:30;padding:16px}
.pwbox[hidden]{display:none}
.pwcard{background:var(--surface);color:var(--ink);padding:18px;border-radius:16px;width:min(340px,100%);display:grid;gap:10px}
.pwcard input,.pwcard textarea{width:100%;font:inherit;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.pwerr{color:#b3352b;margin:0;min-height:1.4em}
.demo{background:#fbe3df;color:#b3352b;text-align:center;border-radius:10px;padding:6px;font-weight:700;margin:0 0 12px}
</style>
</head>

const mem = {};
const store = {
  get(){ try{ return localStorage.getItem(KEY); }catch(e){ return mem[KEY]||null; } },
  set(v){ try{ localStorage.setItem(KEY,v); localStorage.setItem(KEY+'-ver',BASE_V); }catch(e){ mem[KEY]=v; } }
};

const BASE_V = /*V*/3/*W*/;      /* يزداد عند نشر بيانات جديدة */
const DEMO = /*M*/false/*N*/;     /* false عند وضع البيانات الحقيقية */
let PW_H = /*P*/4140592658733146/*Q*/;  /* بصمة كلمة السر */
const BASE = /*D*/[{"id":1,"name":"أحمد","goal":6,"pages":68,"pg":{"1":2,"2":2,"3":2,"4":2,"5":2,"6":2,"7":2,"8":2,"9":2,"10":2,"11":2,"12":2,"13":2,"14":2,"15":2,"16":2,"17":2,"18":2,"19":2,"20":2,"21":2,"594":1,"603":2}},{"id":2,"name":"محمد","goal":3,"pages":47},{"id":3,"name":"يوسف","goal":10,"pages":130}]/*E*/;
let students = JSON.parse(JSON.stringify(BASE));
(function(){
  let v = null, raw = store.get();
  try{ v = localStorage.getItem(KEY+'-ver'); }catch(e){}
  if(raw && (v === null || +v >= BASE_V)){
    try{ students = JSON.parse(raw); }catch(e){}
    if(v === null){ try{ localStorage.setItem(KEY+'-ver', BASE_V); }catch(e){} }
  }
})();
const history = [];
let last = JSON.stringify(students);
function updateUndo(){ const b = document.getElementById('undo'); if(b) b.disabled = !history.length; }
const save = () => {
  const cur = JSON.stringify(students);
  if(cur !== last){ history.push(last); if(history.length > 50) history.shift(); last = cur; }
  store.set(cur); updateUndo();
};
function undo(){
  if(!history.length) return;
  last = history.pop(); students = JSON.parse(last);
  store.set(last); render(); updateUndo();
  if(document.body.classList.contains('detailing')) drawDetail();
}
const nf = new Intl.NumberFormat('ar-EG');
const n = x => nf.format(x);

function markerSVG(){
  return `<img src="${LOGO}" alt="" aria-hidden="true" draggable="false">`;
}

const jn=(s,i)=>(s.jList&&s.jList.length)?s.jList[i-1]:((((s.jFrom||30)-1+(s.jDir||-1)*(i-1))%30)+30)%30+1; /* رقم الجزء على المحطة رقم i */
const jtxt=s=>{const a=Array.from({length:s.goal},(_,i)=>jn(s,i+1));return a.length<=12?a.map(n).join(' + '):n(a[0])+' … '+n(a[a.length-1])};
function card(s){
  const total = s.goal * PAGES_PER_JUZ;
  const pages = Math.min(s.pages, total);
  const pct = total ? pages/total*100 : 0;
  const juz = Math.floor(pages/PAGES_PER_JUZ);
  const rem = pages % PAGES_PER_JUZ;
  const done = pages >= total;
  const many = s.goal > 12;

  let stations = '';
  for(let i=1;i<=s.goal;i++){
    const p = i/s.goal*100;
    const on = pages >= i*PAGES_PER_JUZ;
    if(i===s.goal){
      stations += `<div class="station goal ${on?'on':''}" style="right:${p}%">★</div>`;
    } else if(!many || i%5===0){
      stations += `<div class="station ${on?'on':''}" style="right:${p}%"></div>`;
    }
    if(!many || i%5===0 || i===s.goal){
      stations += `<div class="lbl" style="right:${p}%">${n(jn(s,i))}</div>`;
    }
  }

  const status = done ? 'أتمّ هدفه، بارك الله فيه'
    : `<b>${n(juz)}</b> من ${n(s.goal)} أجزاء${rem?` و${n(rem)} صفحة`:''}`;

  return `<section class="card ${done?'done':''}" data-id="${s.id}">
    <div class="top">
      <h2 class="name">${s.name.replace(/</g,'&lt;')} <small class="jtag">الأجزاء: ${jtxt(s)}</small></h2>
      <div class="count">${status}</div>
    </div>
    <div class="track" role="img" aria-label="${n(Math.round(pct))}٪ من الهدف">
      <div class="rail"></div>
      <div class="fill" style="width:${pct}%"></div>
      ${stations}
      <div class="marker" style="right:${pct}%">${markerSVG()}</div>
    </div>
    <div class="open-row"><button class="mini" data-act="open">📖 خطة حفظ كتاب الله</button></div>
    <div class="ctrl">
      <input type="text" class="nm" data-act="name" value="${s.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" aria-label="اسم الطالب">
      <button data-act="juz">+ جزء</button>
      <button data-act="p5">+٥ صفحات</button>
      <button data-act="p1">+ صفحة</button>
      <button data-act="minus">− صفحة</button>
      <span class="gap"></span>
      <input type="text" class="jl" data-act="jlist" value="${(s.jList||[]).join(' + ')}" placeholder="أجزاء مخصصة مثل: 30 + 22 + 1 (أو اتركها فارغة)" aria-label="الأجزاء المشارك بها">
      ${(s.jList&&s.jList.length)?'':`<label>الهدف <input type="number" min="1" max="30" value="${s.goal}" data-act="goal"></label>
      <label>يبدأ من جزء <input type="number" min="1" max="30" value="${s.jFrom||30}" data-act="jfrom"></label>
      <label><input type="checkbox" data-act="jdir" ${(s.jDir||-1)===-1?'checked':''}> تنازلي</label>`}
      <button data-act="del" class="danger">حذف</button>
    </div>
  </section>`;
}

function render(){
  const list = document.getElementById('list');
  list.innerHTML = students.length ? students.map(card).join('')
    : '<p class="empty">لم تُضَف أسماء الطلاب بعد.</p>';
}

document.getElementById('list').addEventListener('click', e=>{
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const id = +b.closest('.card').dataset.id;
  const s = students.find(x=>x.id===id); const total = s.goal*PAGES_PER_JUZ;
  const act = b.dataset.act;
  if(act==='open'){ openDetail(id); return; }
  if(act==='juz') s.pages = Math.min(total, s.pages+PAGES_PER_JUZ);
  if(act==='p5') s.pages = Math.min(total, s.pages+5);
  if(act==='p1') s.pages = Math.min(total, s.pages+1);
  if(act==='minus') s.pages = Math.max(0, s.pages-1);
  if(act==='del'){
    if(!b.classList.contains('armed')){
      b.classList.add('armed'); b.textContent='اضغط للتأكيد';
      setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed'); b.textContent='حذف'; } }, 3000);
      return;
    }
    students = students.filter(x=>x.id!==id);
  }
  save(); render();
});
document.getElementById('list').addEventListener('change', e=>{
  const act = e.target.dataset.act;
  if(!['goal','name','jfrom','jdir','jlist'].includes(act)) return;
  const s = students.find(x=>x.id===+e.target.closest('.card').dataset.id);
  if(act==='name'){
    const nm = e.target.value.trim();
    if(nm) s.name = nm;
    save(); render(); return;
  }
  if(act==='jlist'){
    const v=e.target.value.replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632);
    const nums=[...new Set((v.match(/\d+/g)||[]).map(Number).filter(k=>k>=1&&k<=30))];
    if(nums.length){ s.jList=nums; s.goal=nums.length; s.pages=Math.min(s.pages,s.goal*PAGES_PER_JUZ); } else delete s.jList;
    save(); render(); return;
  }

(function(){
  const list = document.getElementById('list');
  let drag = null;
  function move(e){
    if(!drag) return;
    const r = drag.track.getBoundingClientRect();
    const total = drag.s.goal * PAGES_PER_JUZ;
    const f = Math.max(0, Math.min(1, (r.right - e.clientX) / r.width));
    const pages = Math.round(f * total);
    drag.s.pages = pages;
    const pct = pages / total * 100;
    drag.m.style.right = pct + '%';
    drag.track.querySelector('.fill').style.width = pct + '%';
    const juz = Math.floor(pages / PAGES_PER_JUZ), rem = pages % PAGES_PER_JUZ;
    drag.c.querySelector('.count').innerHTML = pages >= total ? 'أتمّ هدفه، بارك الله فيه'
      : `<b>${n(juz)}</b> من ${n(drag.s.goal)} أجزاء${rem ? ` و${n(rem)} صفحة` : ''}`;
  }
  function end(){
    if(!drag) return;
    drag = null; save(); render();
  }
  list.addEventListener('pointerdown', e=>{
    const m = e.target.closest('.marker'); if(!m || !document.body.classList.contains('edit')) return;
    const c = m.closest('.card'), track = m.closest('.track');
    drag = {m, c, track, s: students.find(x => x.id === +c.dataset.id)};
    m.setPointerCapture(e.pointerId);
    m.classList.add('drag'); track.classList.add('drag');
    e.preventDefault();
    move(e);
  });
  list.addEventListener('pointermove', move);
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
})();

<script type="text/plain" id="tpl"><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسابقة رتل وارتق (3)</title>
<style>
:root{
  --bg:#e9efea; --surface:#f7faf7; --ink:#183029; --muted:#5d746c;
  --green:#14463d; --green-soft:#cfe0d8; --brass:#b3862a; --brass-soft:#f1e3bd; --line:#c3d3cb;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1f1b; --surface:#16302a; --ink:#e8f1ec; --muted:#94afa5;
    --green:#5fc2a8; --green-soft:#24463d; --brass:#e0b552; --brass-soft:#3d3416; --line:#2d4d43;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Naskh Arabic","Amiri","Geeza Pro","Segoe UI",Tahoma,serif;line-height:1.7;
  padding:max(16px,env(safe-area-inset-top)) 16px 48px}
.wrap{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px}
header.top-head{flex-direction:column;align-items:stretch;gap:16px;margin:14px 8px 22px}
.head-btns{display:flex;gap:8px;justify-content:center;margin:26px 0 6px}
#toggle{background:transparent;color:var(--muted);border:1.5px dashed var(--line);font-size:1rem;padding:8px 22px;opacity:.9}
body.edit{padding-bottom:100px}
body.edit .head-btns{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);margin:0;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:15}
body.edit #toggle{background:var(--green);color:var(--surface);border:1px solid var(--green);font-size:1.1rem;padding:9px 26px;opacity:1}
#undo{display:none}
body.edit #undo{display:inline-block}
button:disabled{opacity:.45;cursor:default}
.banner-img{display:block;width:100%;height:auto;border-radius:12px}
.sub{color:var(--muted);font-size:.95rem;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:6px 14px}
button:hover{border-color:var(--green)}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button.primary{background:var(--green);color:var(--surface);border-color:var(--green)}
.dark-btn-fix{color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.card.done{border-color:var(--brass);background:linear-gradient(0deg,var(--brass-soft),var(--surface) 70%)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font-size:1.25rem;font-weight:700;margin:0}
.count{color:var(--muted);font-size:.95rem}
.count b{color:var(--green);font-size:1.15rem}
.card.done .count b{color:var(--brass)}

/* the track: stations = juz' */
.track{position:relative;height:76px;margin:22px 12px 6px}
.rail,.fill{position:absolute;top:29px;height:6px;border-radius:6px;right:0}
.rail{left:0;background:var(--green-soft)}
.fill{background:var(--green);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.card.done .fill{background:var(--brass)}
.station{position:absolute;top:22px;width:20px;height:20px;margin-right:-10px;border-radius:50%;
  background:var(--surface);border:3px solid var(--green-soft);transition:background .4s,border-color .4s}
.station.on{background:var(--green);border-color:var(--green)}
.card.done .station.on{background:var(--brass);border-color:var(--brass)}
.station.goal{width:26px;height:26px;top:19px;margin-right:-13px;border-color:var(--brass);
  display:grid;place-items:center;font-size:.8rem;color:var(--brass)}
.station.goal.on{background:var(--brass);color:#fff}
.lbl{position:absolute;top:58px;font-size:.78rem;color:var(--muted);transform:translateX(50%);margin-right:0}
.marker{position:absolute;top:7px;width:44px;height:44px;margin-right:-22px;z-index:2;user-select:none;-webkit-user-select:none;
  transition:right .7s cubic-bezier(.2,.8,.2,1)}
.marker img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;
  border:2px solid var(--brass);background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}

.ctrl{display:none;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
body.edit .ctrl{display:flex}
.ctrl input{font:inherit;width:64px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ctrl .gap{flex:1}
.ctrl input.nm,.ctrl input.jl{width:100%;flex:1 1 100%}
.ctrl input.nm{font-weight:700}
.jtag{font-size:.85rem;font-weight:400;color:var(--muted)}
.ctrl input[type=checkbox]{width:auto}
.danger{color:#b3352b}
.danger.armed{background:#b3352b;color:#fff;border-color:#b3352b}
.add{display:none;gap:8px;margin-bottom:16px}
body.edit .add{display:flex}
.add input{font:inherit;flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.add input.n{flex:0 0 80px}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin-top:20px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
body.edit .marker{cursor:grab;touch-action:none}
.marker.drag,.track.drag .fill{transition:none}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  #toggle,.add,.ctrl,.hint{display:none!important}
  .card,.plaque{break-inside:avoid}
}
.marker.drag{cursor:grabbing;transform:scale(1.08)}
@media (prefers-reduced-motion:reduce){.fill,.marker,.station{transition:none}}
.mini{font-size:.85rem;padding:4px 12px}
.open-row{margin-top:10px}
#detail{display:none}
body.detailing #detail{display:block}
body.detailing #list,body.detailing .add,body.detailing .hint,body.detailing .tools{display:none!important}

.tools{display:none;gap:8px;justify-content:center;margin-top:16px}
body.edit .tools{display:flex}
.bar{height:14px;border-radius:99px;border:1.5px solid var(--green);background:var(--surface);overflow:hidden;display:flex;margin:10px 0}
.bar i{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;border:1.5px solid var(--green);margin-left:5px;vertical-align:-2px}
.jg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:440px;margin:12px auto 0}
.jg button{flex:0 0 calc((100% - 42px)/8);aspect-ratio:1;padding:0;border:1.5px solid var(--green);border-radius:50%;font-weight:700;overflow:hidden}
.jg .open{outline:3px solid var(--brass);outline-offset:1px}
.num{background:rgba(255,255,255,.85);color:#183029;border-radius:6px;padding:0 4px;font-size:.8rem;line-height:1.3}
.pgr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.pgr button{min-height:62px;padding:4px 2px;border:1.5px solid var(--green);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2;font-weight:700}
.sn{font-size:.68rem;font-weight:700;text-align:center;max-width:100%}
.auto{background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.9}
.auto.muted{font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;border-radius:8px;padding:0 8px;font-size:.8rem;color:#fff;margin-left:4px}
.tg{background:var(--green)}.td{background:var(--brass)}
.restore{display:block;width:100%;margin-bottom:14px;background:transparent;border:2px dashed var(--green);color:var(--green);border-radius:16px;padding:12px;font-weight:700}
.s1{background:var(--brass)!important;color:#fff}
.s2{background:var(--green)!important;color:var(--surface)}
.lbl2{display:block;font-weight:700;margin:12px 0 4px}
.lines,.dt{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink)}
.lines{min-height:70px;resize:vertical}
.tick{display:flex;align-items:center;gap:8px;margin-top:8px;width:100%;padding:8px 12px;border-radius:12px}
.tick.on{background:var(--green);color:var(--surface)}
.box{width:20px;height:20px;border:2px solid currentColor;border-radius:6px;display:grid;place-items:center;font-size:.8rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:var(--surface);border-radius:99px;padding:10px 18px;z-index:20}
.two,.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{margin:14px 0}
/* عرض فقط إلى أن تضغط «تعديل» */
body:not(.edit) #detail [data-d="hide"],body:not(.edit) #detail [data-d="show"],body:not(.edit) #detail [data-d="fill"],body:not(.edit) #detail [data-d="newweek"],body:not(.edit) #detail [data-d="sync"]{display:none}
.lines:disabled,.dt:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);resize:none}
.pwbox{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:30;padding:16px}
.pwbox[hidden]{display:none}
.pwcard{background:var(--surface);color:var(--ink);padding:18px;border-radius:16px;width:min(340px,100%);display:grid;gap:10px}
.pwcard input,.pwcard textarea{width:100%;font:inherit;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.pwerr{color:#b3352b;margin:0;min-height:1.4em}
.demo{background:#fbe3df;color:#b3352b;text-align:center;border-radius:10px;padding:6px;font-weight:700;margin:0 0 12px}
</style>

const mem = {};
const store = {
  get(){ try{ return localStorage.getItem(KEY); }catch(e){ return mem[KEY]||null; } },
  set(v){ try{ localStorage.setItem(KEY,v); localStorage.setItem(KEY+'-ver',BASE_V); }catch(e){ mem[KEY]=v; } }
};

const BASE_V = /*V*/1/*W*/;      /* يزداد عند نشر بيانات جديدة */
const DEMO = /*M*/false/*N*/;     /* false عند وضع البيانات الحقيقية */
let PW_H = /*P*/4140592658733146/*Q*/;  /* بصمة كلمة السر */
const BASE = /*D*/[]/*E*/;
let students = JSON.parse(JSON.stringify(BASE));
(function(){
  let v = null, raw = store.get();
  try{ v = localStorage.getItem(KEY+'-ver'); }catch(e){}
  if(raw && (v === null || +v >= BASE_V)){
    try{ students = JSON.parse(raw); }catch(e){}
    if(v === null){ try{ localStorage.setItem(KEY+'-ver', BASE_V); }catch(e){} }
  }
})();
const history = [];
let last = JSON.stringify(students);
function updateUndo(){ const b = document.getElementById('undo'); if(b) b.disabled = !history.length; }
const save = () => {
  const cur = JSON.stringify(students);
  if(cur !== last){ history.push(last); if(history.length > 50) history.shift(); last = cur; }
  store.set(cur); updateUndo();
};
function undo(){
  if(!history.length) return;
  last = history.pop(); students = JSON.parse(last);
  store.set(last); render(); updateUndo();
  if(document.body.classList.contains('detailing')) drawDetail();
}
const nf = new Intl.NumberFormat('ar-EG');
const n = x => nf.format(x);

function markerSVG(){
  return `<img src="${LOGO}" alt="" aria-hidden="true" draggable="false">`;
}

const jn=(s,i)=>(s.jList&&s.jList.length)?s.jList[i-1]:((((s.jFrom||30)-1+(s.jDir||-1)*(i-1))%30)+30)%30+1; /* رقم الجزء على المحطة رقم i */
const jtxt=s=>{const a=Array.from({length:s.goal},(_,i)=>jn(s,i+1));return a.length<=12?a.map(n).join(' + '):n(a[0])+' … '+n(a[a.length-1])};
function card(s){
  const total = s.goal * PAGES_PER_JUZ;
  const pages = Math.min(s.pages, total);
  const pct = total ? pages/total*100 : 0;
  const juz = Math.floor(pages/PAGES_PER_JUZ);
  const rem = pages % PAGES_PER_JUZ;
  const done = pages >= total;
  const many = s.goal > 12;

  let stations = '';
  for(let i=1;i<=s.goal;i++){
    const p = i/s.goal*100;
    const on = pages >= i*PAGES_PER_JUZ;
    if(i===s.goal){
      stations += `<div class="station goal ${on?'on':''}" style="right:${p}%">★</div>`;
    } else if(!many || i%5===0){
      stations += `<div class="station ${on?'on':''}" style="right:${p}%"></div>`;
    }
    if(!many || i%5===0 || i===s.goal){
      stations += `<div class="lbl" style="right:${p}%">${n(jn(s,i))}</div>`;
    }
  }

  const status = done ? 'أتمّ هدفه، بارك الله فيه'
    : `<b>${n(juz)}</b> من ${n(s.goal)} أجزاء${rem?` و${n(rem)} صفحة`:''}`;

  return `<section class="card ${done?'done':''}" data-id="${s.id}">
    <div class="top">
      <h2 class="name">${s.name.replace(/</g,'&lt;')} <small class="jtag">الأجزاء: ${jtxt(s)}</small></h2>
      <div class="count">${status}</div>
    </div>
    <div class="track" role="img" aria-label="${n(Math.round(pct))}٪ من الهدف">
      <div class="rail"></div>
      <div class="fill" style="width:${pct}%"></div>
      ${stations}
      <div class="marker" style="right:${pct}%">${markerSVG()}</div>
    </div>
    <div class="open-row"><button class="mini" data-act="open">📖 خطة حفظ كتاب الله</button></div>
    <div class="ctrl">
      <input type="text" class="nm" data-act="name" value="${s.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" aria-label="اسم الطالب">
      <button data-act="juz">+ جزء</button>
      <button data-act="p5">+٥ صفحات</button>
      <button data-act="p1">+ صفحة</button>
      <button data-act="minus">− صفحة</button>
      <span class="gap"></span>
      <input type="text" class="jl" data-act="jlist" value="${(s.jList||[]).join(' + ')}" placeholder="أجزاء مخصصة مثل: 30 + 22 + 1 (أو اتركها فارغة)" aria-label="الأجزاء المشارك بها">
      ${(s.jList&&s.jList.length)?'':`<label>الهدف <input type="number" min="1" max="30" value="${s.goal}" data-act="goal"></label>
      <label>يبدأ من جزء <input type="number" min="1" max="30" value="${s.jFrom||30}" data-act="jfrom"></label>
      <label><input type="checkbox" data-act="jdir" ${(s.jDir||-1)===-1?'checked':''}> تنازلي</label>`}
      <button data-act="del" class="danger">حذف</button>
    </div>
  </section>`;
}

function render(){
  const list = document.getElementById('list');
  list.innerHTML = students.length ? students.map(card).join('')
    : '<p class="empty">لم تُضَف أسماء الطلاب بعد.</p>';
}

document.getElementById('list').addEventListener('click', e=>{
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const id = +b.closest('.card').dataset.id;
  const s = students.find(x=>x.id===id); const total = s.goal*PAGES_PER_JUZ;
  const act = b.dataset.act;
  if(act==='open'){ openDetail(id); return; }
  if(act==='juz') s.pages = Math.min(total, s.pages+PAGES_PER_JUZ);
  if(act==='p5') s.pages = Math.min(total, s.pages+5);
  if(act==='p1') s.pages = Math.min(total, s.pages+1);
  if(act==='minus') s.pages = Math.max(0, s.pages-1);
  if(act==='del'){
    if(!b.classList.contains('armed')){
      b.classList.add('armed'); b.textContent='اضغط للتأكيد';
      setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed'); b.textContent='حذف'; } }, 3000);
      return;
    }
    students = students.filter(x=>x.id!==id);
  }
  save(); render();
});
document.getElementById('list').addEventListener('change', e=>{
  const act = e.target.dataset.act;
  if(!['goal','name','jfrom','jdir','jlist'].includes(act)) return;
  const s = students.find(x=>x.id===+e.target.closest('.card').dataset.id);
  if(act==='name'){
    const nm = e.target.value.trim();
    if(nm) s.name = nm;
    save(); render(); return;
  }
  if(act==='jlist'){
    const v=e.target.value.replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632);
    const nums=[...new Set((v.match(/\d+/g)||[]).map(Number).filter(k=>k>=1&&k<=30))];
    if(nums.length){ s.jList=nums; s.goal=nums.length; s.pages=Math.min(s.pages,s.goal*PAGES_PER_JUZ); } else delete s.jList;
    save(); render(); return;
  }
  if(act==='jfrom'){ s.jFrom = Math.max(1, Math.min(30, +e.target.value||30)); save(); render(); return; }
  if(act==='jdir'){ s.jDir = e.target.checked ? -1 : 1; save(); render(); return; }
  s.goal = Math.max(1, Math.min(30, +e.target.value||1));
  s.pages = Math.min(s.pages, s.goal*PAGES_PER_JUZ);
  save(); render();
});
/* drag the logo along the track to set progress */
(function(){
  const list = document.getElementById('list');
  let drag = null;
  function move(e){
    if(!drag) return;
    const r = drag.track.getBoundingClientRect();
    const total = drag.s.goal * PAGES_PER_JUZ;
    const f = Math.max(0, Math.min(1, (r.right - e.clientX) / r.width));
    const pages = Math.round(f * total);
    drag.s.pages = pages;
    const pct = pages / total * 100;
    drag.m.style.right = pct + '%';
    drag.track.querySelector('.fill').style.width = pct + '%';
    const juz = Math.floor(pages / PAGES_PER_JUZ), rem = pages % PAGES_PER_JUZ;
    drag.c.querySelector('.count').innerHTML = pages >= total ? 'أتمّ هدفه، بارك الله فيه'
      : `<b>${n(juz)}</b> من ${n(drag.s.goal)} أجزاء${rem ? ` و${n(rem)} صفحة` : ''}`;
  }
  function end(){
    if(!drag) return;
    drag = null; save(); render();
  }
  list.addEventListener('pointerdown', e=>{
    const m = e.target.closest('.marker'); if(!m || !document.body.classList.contains('edit')) return;
    const c = m.closest('.card'), track = m.closest('.track');
    drag = {m, c, track, s: students.find(x => x.id === +c.dataset.id)};
    m.setPointerCapture(e.pointerId);
    m.classList.add('drag'); track.classList.add('drag');
    e.preventDefault();
    move(e);
  });
  list.addEventListener('pointermove', move);
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
})();

const h53=(s,seed=0)=>{let a=0xdeadbeef^seed,b=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return 4294967296*(2097151&b)+(a>>>0)};

function stat(m,j){const[a,b]=jr(j);let c=0,t=0;for(let p=a;p<=b;p++){if(m[p]===1)c++;else if(m[p]===2)t++}return{c,t,k:b-a+1}}

function juzInfo(m,st){const f=[],q=[];for(let j=0;j<30;j++){const[a,b]=jr(j);let g=0;for(let p=a;p<=b;p++)if(m[p]===st)g++;const k=b-a+1;if(g===k)f.push(j+1);else if(g)q.push('جزء '+(j+1)+' ('+g+'/'+k+' صفحة)')}return(f.length?'أجزاء كاملة: '+f.join('، '):'')+(f.length&&q.length?' — ':'')+(q.length?'أجزاء جزئية: '+q.join('، '):'')}

D.addEventListener('click',e=>{

  if(a==='back'){closeDetail();return}
  const s=curS(); if(!s)return; const m=s.pg=s.pg||{};
  if(a==='juz'){const j=+b.dataset.j;openJ=openJ===j?null:j;drawDetail();return}
  if(a==='wa'){window.open('https://wa.me/?text='+encodeURIComponent(summary(s)),'_blank');return}
  if(a==='copy'){const t=summary(s);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('تم النسخ'),()=>toast('تعذّر النسخ'));return}
  if(!document.body.classList.contains('edit')){toast('اضغط «تعديل» أولاً للتحرير');return}
  if(a==='page'){const p=+b.dataset.p,x=((m[p]||0)+1)%3;if(x)m[p]=x;else delete m[p]}
  else if(a==='fill'){const v=+b.dataset.v,[x,z]=jr(openJ);for(let p=x;p<=z;p++){if(v)m[p]=v;else delete m[p]}}
  else if(a==='tick'){s[b.dataset.flag]=!s[b.dataset.flag]}
  else if(a==='hide'||a==='show'){s['hide'+b.dataset.k]=a==='hide'}
  else if(a==='newweek'){if(s.memoDone)s.memo='';s.memoDone=s.reviewDone=s.thabitDone=false;toast('بدأ أسبوع جديد')}
  else if(a==='sync'){const T=tot(m);s.pages=Math.min(s.goal*PAGES_PER_JUZ,T.t+T.c);toast('تم ضبط تقدّم المسابقة')}

document.getElementById('imp').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{try{
    const arr=JSON.parse(r.result); if(!Array.isArray(arr))throw 0; let k=0;
    arr.forEach((x,i)=>{ if(!x||!x.name)return;
      const t=x.goal!==undefined?x:{pg:x.pages||{},memo:x.weeklyMemo||'',review:x.weeklyReview||'',thabit:x.thabit||'',memoDone:!!x.memoDone,reviewDone:!!x.reviewDone,thabitDone:!!x.thabitDone,start:x.startDate||'',khatma:x.khatmaDate||''};
      const old=students.find(s=>s.name.trim()===x.name.trim());
      if(old)Object.assign(old,t,{id:old.id,name:old.name,goal:old.goal,pages:x.goal!==undefined?x.pages:old.pages});
      else students.push(Object.assign({goal:6,pages:0},t,{id:Date.now()+i,name:x.name}));
      k++});
    save();render();toast('تم استيراد '+k+' طالب');
  }catch(_){toast('الملف غير صالح')}};
  r.readAsText(f); e.target.value='';
};
/* ===== نشر التعديلات: الصفحة تعيد بناء نفسها ببيانات جديدة ===== */
const RAW='<'+'/script', ESC='<\\/script', SLOT='<!--TP'+'L-->';
function buildHtml(){
  const t=document.getElementById('tpl').textContent.split(ESC).join(RAW);
  const slot='<script type="text/plain" id="tpl">'+t.split(RAW).join(ESC)+RAW+'>';
  const data=JSON.stringify(students).replace(/</g,'\\u003c');
  return t.replace(SLOT,()=>slot)
    .replace(/\/\*D\*\/[\s\S]*?\/\*E\*\//,()=>'/*D*/'+data+'/*E*/')
    .replace(/\/\*V\*\/[\s\S]*?\/\*W\*\//,()=>'/*V*/'+(BASE_V+1)+'/*W*/')
    .replace(/\/\*M\*\/[\s\S]*?\/\*N\*\//,()=>'/*M*/false/*N*/')
    .replace(/\/\*P\*\/[\s\S]*?\/\*Q\*\//,()=>'/*P*/'+PW_H+'/*Q*/');
}
async function publishNow(){
  try{
    const art=window.claude&&await claude.use('artifact');
    if(!art){toast('النشر غير متاح هنا');return false}
    await art.publish(buildHtml());
    return true;
  }catch(e){
    const c=e&&e.code;
    toast(c==='not_writer'||c==='not_granted'?'ليست لديك صلاحية النشر':c==='conflict'?'تغيّرت الصفحة، أعد التحميل':'تعذّر النشر');
    return false;
  }
}
document.getElementById('pub').onclick=async()=>{
  const btn=document.getElementById('pub'); btn.disabled=true; toast('جارٍ النشر…');
  if(!(await publishNow())) btn.disabled=false;
};
